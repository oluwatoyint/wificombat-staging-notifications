name: Publish Docker Image to AWS ECR, and deploy to AWS Lambda

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - feature/devops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: wifi-combat-notifications-api
      IMAGE_TAG: ${{ github.sha }}
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
      AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{env.AWS_DEFAULT_REGION}}
          aws-access-key-id: ${{env.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{env.AWS_SECRET_ACCESS_KEY}}

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build the Docker image and push to AWS ECR
      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg PORT=${{ secrets.PORT }} \
            --build-arg TOKEN_KEY=${{ secrets.TOKEN_KEY }} \
            --build-arg username=${{ secrets.username }} \
            --build-arg pass=${{ secrets.pass }} \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            --build-arg AWS_REGION=${{ secrets.AWS_REGION }} \
            --build-arg AWS_BUCKET=${{ secrets.AWS_BUCKET }} \
            --build-arg TOKEN_SECRET=${{ secrets.TOKEN_SECRET }} \
            --build-arg PROJ_ENV=${{ secrets.PROJ_ENV }} \
            --build-arg NODE_ENV=${{ secrets.NODE_ENV }} \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # Step 6: Deploy the app container to AWS Lambda
      - name: Deploy Lambda
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws lambda update-function-code --function-name ${{env.REPOSITORY}} --image-uri $REGISTRY/$REPOSITORY:$IMAGE_TAG
